# dist/ のフォントを添付した GitHub Release を作成する
#   - v* タグを push したとき
#   - Actions 画面から手動実行したとき（指定したタグを実行中のコミットに作成）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ (例: v1.000)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make zip archives
        run: |
          set -eu
          mkdir -p out
          cp dist/Regular/* dist/AllWeights/* dist/Regular-JPVariants/* dist/OTF/* dist/WOFF2/* out/
          # zip 名 → dist/ のディレクトリ
          for pair in Regular:Regular AllWeights:AllWeights Regular-JPVariants:Regular-JPVariants \
                      Regular-OTF:OTF Regular-WOFF2:WOFF2; do
            set=${pair%%:*}; dir=${pair#*:}
            rm -rf "pkg/NS-Font-$set" && mkdir -p "pkg/NS-Font-$set"
            cp dist/$dir/* OFL.txt "pkg/NS-Font-$set/"
            (cd pkg && zip -q -r "../out/NS-Font-$set.zip" "NS-Font-$set")
          done
          ls -l out

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # タグが無ければ実行中のコミットにタグを作成する（手動実行の場合）
            gh release create "$TAG" --target "$GITHUB_SHA" --title "NS-Font $TAG" \
              --notes-file .github/release-notes.md --latest
          fi
          gh release upload "$TAG" out/* --clobber
